name: Dream Engine — Auto-Populate MasterLogs

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Dream Engine
        run: python3 scripts/dream_engine.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push updates
        run: |
          git config user.name "Aegis Dream Engine"
          git config user.email "chrisalunlloyd2@gmail.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto: nightly dream engine update $(date +%Y-%m-%d)" && git push origin main)
